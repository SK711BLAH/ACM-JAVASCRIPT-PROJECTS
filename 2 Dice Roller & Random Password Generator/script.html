<!DOCTYPE html>
<html>
<head>
    <title>Dice Roller & Password Generator</title>
</head>
<body>

    <h2>Dice Roller</h2>
    <input type="number" id="numDice" min="1" value="1">
    <button id="rollBtn">Roll Dice</button>
    <p id="diceResult"></p>
    <div id="diceImages"></div>

    <h2>Random Password Generator</h2>
    <input type="number" id="pwLength" min="1" value="12">
    <br>
    <input type="checkbox" id="includeLower" checked>
    <label for="includeLower">Lowercase</label>
    <br>
    <input type="checkbox" id="includeUpper" checked>
    <label for="includeUpper">Uppercase</label>
    <br>
    <input type="checkbox" id="includeNumbers" checked>
    <label for="includeNumbers">Numbers</label>
    <br>
    <input type="checkbox" id="includeSymbols">
    <label for="includeSymbols">Symbols</label>
    <br>
    <button id="generateBtn">Generate</button>
    <p id="pwResult"></p>

    <script src="script.js"></script>
</body>
</html>
